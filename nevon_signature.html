    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        .sig-container {
            width: 450px;
            height: 129px;
            background-color: #f3f4f6;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .sig-table {
            border-collapse: collapse;
            width: 100%;
            height: 100%;
        }

        .sig-col-left {
            width: 71px;
            background-color: #07163c;
            position: relative;
            vertical-align: middle;
            text-align: center;
        }

        .sig-photo-cell {
            position: relative;
            width: 1px;
            vertical-align: middle;
        }

        .sig-photo {
            position: absolute;
            left: -37px;
            top: 50%;
            transform: translateY(-50%);
            width: 74px;
            height: 74px;
            border-radius: 12px;
            object-fit: cover;
            border: none;
            z-index: 10;
        }

        .sig-content-cell {
            padding-left: 55px;
            vertical-align: middle;
            text-align: left;
        }

        .sig-name {
            font-size: 10px;
            font-weight: 700;
            color: #07163c;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .sig-title {
            font-size: 5px;
            font-weight: 500;
            color: #4b5563;
            margin: 1px 0 6px 0;
            line-height: 1.2;
        }

        .sig-info-row {
            margin-bottom: 4px;
            font-size: 7px;
            font-weight: 500;
            color: #07163c;
            line-height: 12px;
        }

        .sig-info-row a {
            color: #07163c;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .sig-info-row a:hover {
            color: #3b82f6;
        }

        .sig-divider-cell {
            width: 1px;
            vertical-align: middle;
            padding: 0 10px;
        }

        .sig-divider {
            height: 90px;
            border-left: 0.5px solid #073391;
        }

        .sig-right-cell {
            width: 110px;
            vertical-align: middle;
            text-align: center;
            padding-right: 15px;
        }

        .sig-logo {
            width: 55.59px;
            height: 41px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .sig-social-table {
            margin: 0 auto;
        }

        .sig-social-icon {
            width: 12px;
            height: 12px;
            display: block;
            transition: opacity 0.2s ease;
        }

        .sig-social-icon:hover {
            opacity: 0.8;
        }

        @media only screen and (max-width: 480px) {
            .sig-container {
                width: 100% !important;
                max-width: 400px !important;
                height: auto !important;
                border-radius: 8px !important;
            }

            .sig-col-left {
                width: 60px !important;
            }

            .sig-photo {
                width: 64px !important;
                height: 64px !important;
                left: -32px !important;
            }

            .sig-content-cell {
                padding-left: 42px !important;
                padding-top: 15px !important;
                padding-bottom: 15px !important;
            }

            .sig-divider-cell {
                padding: 0 5px !important;
            }

            .sig-right-cell {
                padding-right: 10px !important;
                width: 90px !important;
            }

            .sig-logo {
                width: 45px !important;
                height: auto !important;
            }
